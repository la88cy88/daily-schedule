<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="考研 + 力量训练一日时间表打卡：每日计划可自定义时间段，每周菜单可编辑，按身高体重年龄自动计算饮水目标并按 100ml 打卡，适配 iPhone Safari 与主屏幕 PWA。">

  <title>一日计划</title>

  <!-- iOS PWA / 主屏幕 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="一日计划">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="icon" type="image/svg+xml" href="./icon.svg">

  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="./styles.css?v=3">
</head>
<body>
  <header class="app-header" id="app-header">
    <div class="header-inner">
      <div class="header-top">
        <div class="brand-block">
          <h1 class="app-title">一日计划</h1>
          <p class="app-date" id="app-date">----</p>
        </div>
        <div class="header-right">
          <time class="app-clock" id="app-clock" aria-label="当前时间">--:--</time>
          <button type="button" id="edit-btn" class="hdr-btn edit-btn" aria-pressed="false" aria-label="编辑计划时段">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5 4 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="edit-btn-label">编辑</span>
          </button>
          <button type="button" id="reset-btn" class="hdr-btn reset-btn" aria-label="重置今天">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="reset-btn-label">重置</span>
          </button>
        </div>
      </div>

      <div class="mode-toggle" id="mode-toggle" role="group" aria-label="视图切换">
        <button type="button" class="mode-btn" data-mode="daily" aria-pressed="false">
          <span class="mode-dot" aria-hidden="true"></span>每日计划
        </button>
        <button type="button" class="mode-btn" data-mode="menu" aria-pressed="false">
          <span class="mode-dot" aria-hidden="true"></span>每周菜单
        </button>
        <button type="button" class="mode-btn" data-mode="water" aria-pressed="false">
          <span class="mode-dot" aria-hidden="true"></span>喝大水
        </button>
      </div>

      <div class="progress-block">
        <div class="progress-meta">
          <span class="progress-count" id="progress-text">0/0</span>
          <span class="progress-pct" id="progress-pct">0%</span>
        </div>
        <div class="progress-track" id="progress-track" role="progressbar"
             aria-label="今日完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="app-main" id="app-main">
    <section class="now-card" id="now-card" role="button" tabindex="0" aria-label="当前任务预告，点击定位">
      <div class="now-status" id="now-status">—</div>
      <div class="now-body">
        <div class="now-time-row">
          <span class="now-time" id="now-time">--:--</span>
          <span class="now-hint" aria-hidden="true">点击定位</span>
        </div>
        <h2 class="now-title" id="now-title">加载中…</h2>
        <p class="now-details" id="now-details"></p>
        <p class="now-meta" id="now-meta"></p>
      </div>
    </section>

    <div class="edit-bar" id="edit-bar" hidden>
      <span class="edit-bar-text" id="edit-bar-text">编辑模式 · 可改时间段与内容</span>
      <button type="button" class="edit-bar-restore" id="restore-btn">恢复默认</button>
    </div>

    <h2 class="list-heading" id="list-heading">今日安排</h2>
    <div class="task-list" id="task-list" aria-label="任务列表"></div>
  </main>

  <button type="button" class="fab" id="fab-back-now" aria-label="回到当前任务" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    回到当前
  </button>

  <div class="visually-hidden" id="announcer" aria-live="polite" role="status"></div>

  <noscript>
    <p class="noscript-tip">此页面需要启用 JavaScript 才能打卡。请开启 Safari 设置中的 JavaScript。</p>
  </noscript>

  <script src="./haptics.js?v=3"></script>
  <script src="./sounds.js?v=3"></script>
  <script src="./app.js?v=3"></script>
</body>
</html>
